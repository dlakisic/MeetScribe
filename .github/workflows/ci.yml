name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Run ruff check
        run: uv run --group dev ruff check .

      - name: Run ruff format check
        run: uv run --group dev ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          MEETSCRIBE_DATA_DIR: /tmp/meetscribe

  # The GPU worker image builds in its own workflow (worker.yml), only when it changes.

  package-extension:
    name: Package Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create extension zip
        run: |
          cd chrome-extension
          zip -r ../meetscribe-extension.zip . -x "*.git*"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: meetscribe-extension.zip
          retention-days: 30
