services:
  worker:
    build:
      context: ../../
      dockerfile: gpu-worker/Dockerfile
    image: meetscribe-worker:latest
    container_name: meetscribe-worker
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Speaker diarization (pyannote): the .env file next to this compose file is only
      # used for substitution, so variables must be passed explicitly.
      - HF_TOKEN=${HF_TOKEN:-}
      - PYANNOTE_PIPELINE=${PYANNOTE_PIPELINE:-}
    ports:
      - "8001:8001"

